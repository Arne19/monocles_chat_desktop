[package]
name = "mxc-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mxc-store = { path = "../mxc-store" }
mxc-omemo = { path = "../mxc-omemo" }
mxc-media = { path = "../mxc-media" }

tokio = { workspace = true, features = ["io-util"] }
tokio-xmpp = { workspace = true }
xmpp-parsers = { workspace = true }
jid = { workspace = true }
minidom = { workspace = true }
# tokio-xmpp 6's ServerConnector trait returns a `sasl::common::ChannelBinding`, which it does
# not re-export — our connector (src/connect.rs) and SASL step (src/sasl_auth.rs) name it
# directly. Same version tokio-xmpp links, so it resolves to a single crate.
sasl = "0.5"
# tokio-xmpp 6 hands the reader loop a typed `Stanza` (and `send_stanza` wants one), but the
# whole XEP layer here works on raw `minidom::Element`. `xso::transform` converts between the
# two at the client boundary; the `minidom` feature enables Element's AsXml/FromXml impls.
xso = { version = "0.4", features = ["minidom"] }

async-channel = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha1 = { workspace = true }
# HTTP file upload/download (XEP-0363) + aesgcm:// file encryption.
reqwest = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
# XEP-0231 BoB content-id hashing for inline stickers.
sha2 = { workspace = true }
# Parsing the WebXDC `notify` dict (selfAddr → text) off the wire.
serde_json = "1"
# Pin the process-wide rustls crypto provider (aws-lc-rs): tokio-xmpp builds its TLS configs
# against the process default, so it must be installed explicitly. See client.rs.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# NOTE: tokio-xmpp 6's own DirectTls/StartTls connectors are not used: they build their rustls
# configuration internally, so neither TLS 1.3-only nor DANE could be added to them.
# Our own connector (src/connect.rs): DNSSEC-validated SRV/A/AAAA/TLSA lookups (same hickory
# version tokio-xmpp links, plus its DNSSEC validator), our own rustls config (TLS 1.3 only,
# DANE-aware certificate verification) and SPKI extraction for TLSA selector 1.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config", "dnssec-aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
webpki-roots = "1"
x509-parser = "0.18"
# Wipe the in-memory password on drop.
zeroize = "1"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# SCRAM server signature for the end-to-end login tests (src/sasl_auth.rs).
hmac = { workspace = true }
# A real DER certificate for the DANE matching tests (src/connect.rs).
webpki-root-certs = "1"
