[package]
name = "mxc-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
sqlx = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
# Media-cache encryption at rest (src/cache.rs).
aes-gcm = { workspace = true }
sha2 = { workspace = true }
# Build SQLite as SQLCipher (encrypted DB at rest). Feature-unifies with sqlx's
# libsqlite3-sys so the linked engine supports `PRAGMA key`. Links system OpenSSL.
# Pinned to 0.37: sqlx 0.9 requires libsqlite3-sys >=0.30.1,<0.38, so they must share 0.37.x.
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher"] }

# Secret storage backend (see src/secrets.rs) is platform-specific.
[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = { workspace = true }
